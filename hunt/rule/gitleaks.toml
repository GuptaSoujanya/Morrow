title = "HOUND gitleaks policy"

# Extends the gitleaks default ruleset shipped inside the pinned binary.
# The binary version and digest are recorded in hunt/provenance.yaml.
[extend]
useDefault = true

# Ignore policy, mirrored in hunt/scope.yaml. Each path is a Go regular
# expression matched against the repository-relative file path.
#   venv/, data/, .omo/, node_modules/ : gitignored dependency, state, and session material
#   .env                               : the designated local secret store, gitignored,
#                                        verified absent from history by the git scan
#   hunt/                              : the audit harness itself (fixtures with planted positives,
#                                        pinned rule packs, volatile results); never target code
[[allowlists]]
description = "HOUND ignore policy"
paths = [
  '''^venv/''',
  '''^data/''',
  '''^\.omo/''',
  '''^\.pytest_cache/''',
  '''(^|/)node_modules/''',
  '''^\.env$''',
  '''^hunt/''',
]
