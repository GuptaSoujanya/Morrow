# HOUND custom semgrep rules. Preserved across update runs; digest recorded in provenance.
# Every rule carries metadata.hound_class naming one of the ten critical classes.
rules:
  - id: hound.python.subprocess-open-dynamic
    languages: [python]
    severity: WARNING
    message: >-
      macOS `open` launched with a non-literal target. A caller-controlled string
      opens arbitrary applications, files, or URLs with the user's privileges.
    metadata:
      hound_class: injection
      cwe: "CWE-78"
    patterns:
      - pattern-either:
          - pattern: subprocess.Popen(["open", $T, ...], ...)
          - pattern: subprocess.run(["open", $T, ...], ...)
          - pattern: subprocess.call(["open", $T, ...], ...)
          - pattern: subprocess.check_call(["open", $T, ...], ...)
      - metavariable-pattern:
          metavariable: $T
          patterns:
            - pattern: $X
            - pattern-not: '"..."'

  - id: hound.python.sqlite-shared-connection
    languages: [python]
    severity: WARNING
    message: >-
      sqlite3 connection opened with check_same_thread=False. One connection shared
      across threads without an external lock interleaves transactions.
    metadata:
      hound_class: concurrency
      cwe: "CWE-362"
    pattern: sqlite3.connect(..., check_same_thread=False, ...)

  - id: hound.python.subprocess-shell-format
    languages: [python]
    severity: ERROR
    message: >-
      Shell command assembled from a formatted string and run with shell=True.
      Any interpolated value that reaches this line is a command injection.
    metadata:
      hound_class: injection
      cwe: "CWE-78"
    patterns:
      - pattern-either:
          - pattern: subprocess.$F(f"...", ..., shell=True, ...)
          - pattern: subprocess.$F("..." % $A, ..., shell=True, ...)
          - pattern: subprocess.$F("...".format(...), ..., shell=True, ...)
          - pattern: subprocess.$F($S + $A, ..., shell=True, ...)
          - pattern: os.system(f"...")
          - pattern: os.system("..." % $A)
          - pattern: os.system("...".format(...))
          - pattern: os.system($S + $A)

  - id: hound.python.yaml-load-no-loader
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load without a Loader argument, or with an unsafe loader, instantiates
      arbitrary Python objects from the document.
    metadata:
      hound_class: injection
      cwe: "CWE-502"
    patterns:
      - pattern-either:
          - pattern: yaml.load($D)
          - pattern: yaml.load($D, Loader=yaml.Loader)
          - pattern: yaml.load($D, Loader=yaml.UnsafeLoader)
          - pattern: yaml.load($D, Loader=yaml.FullLoader)
          - pattern: yaml.unsafe_load($D)
          - pattern: yaml.full_load($D)

  - id: hound.python.urlopen-dynamic
    languages: [python]
    severity: WARNING
    message: >-
      urllib opens a URL that is not a string literal. When the URL comes from a
      feed, a page, or a config file this is a server-side request forgery sink.
    metadata:
      hound_class: injection
      cwe: "CWE-918"
    patterns:
      - pattern-either:
          - pattern: urllib.request.urlopen($U, ...)
          - pattern: urllib.request.urlretrieve($U, ...)
      - metavariable-pattern:
          metavariable: $U
          patterns:
            - pattern: $X
            - pattern-not: '"..."'
            - pattern-not: f"..."

  - id: hound.shell.curl-pipe-shell
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.sh"
        - "scripts/*"
    message: Remote content piped straight into a shell interpreter.
    metadata:
      hound_class: supply
      cwe: "CWE-494"
    pattern-regex: 'curl[^\n|]*\|\s*(sudo\s+)?(ba|z)?sh\b'

  - id: hound.shell.secret-in-launchd-plist
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "*.sh"
        - "*.plist"
    message: >-
      A credential-named key is written into a launchd property list. Files under
      ~/Library/LaunchAgents are readable by every process running as the user.
    metadata:
      hound_class: secret
      cwe: "CWE-312"
    pattern-regex: '<key>[A-Z0-9_]*(PASSWORD|TOKEN|SECRET)[A-Z0-9_]*</key>'

  - id: hound.python.log-credential
    languages: [python]
    severity: INFO
    message: A logging or print call whose arguments name a password, token, or secret.
    metadata:
      hound_class: secret
      cwe: "CWE-532"
    pattern-regex: '(?i)(logging|logger|log|print)\.?(info|debug|warning|error|exception)?\([^)\n]*(password|app_password|token|secret)[^)\n]*\)'
