lane: pipeline
lane_run:
  first_attempt: {task: bg_c3b29002, session: ses_e9d44ffbdffeu4ezV2gSL1mEGn, status: completed, duration: "3m 11s"}
entry_points:
  - kind: cli
    name: "python3 -m pipeline [run|continue|status|learn] [--fresh --dry-run --only --skip --cli --agents --env -v]"
    path: pipeline/__main__.py
    line: 5
    note: >-
      sys.exit(main()) runs at import time and has no __name__ guard. main() in pipeline/run.py:250 parses argv and
      builds a Memory in the relative .memory/ directory. Every relative path (.memory, .research, data/resume/base.tex)
      resolves against the caller's cwd.
  - kind: import
    name: pipeline.run.main / run_day / build_stages / board_names
    path: pipeline/run.py
    line: 250
    note: >-
      main() is the test seam. run_day(args, stages, mem, planned) at line 161 accepts Stage tuples or plain
      (name, callable) pairs. The tests call it directly with stub callables.
  - kind: import
    name: common.ai_cli.ask
    path: common/ai_cli.py
    line: 58
    note: >-
      Spawns the claude or kiro-cli subprocess, always as an argv list with no shell. The prompt includes
      LLM-generated study notes and resume text. The binary and model are chosen by the PIPELINE_AI_CLI and
      PIPELINE_AI_MODEL env vars and the --cli flag.
  - kind: import
    name: common.memory.Memory
    path: common/memory.py
    line: 59
    note: >-
      Checkpoint in .memory/progress.json, <date>.md and README.md. Used by pipeline/run.py. The web/ and
      launchd consumers were not found in a grep for pipeline, common.memory and ai_cli.
  - kind: cli
    name: python3 -m pipeline learn --done
    path: pipeline/run.py
    line: 259
    note: Calls learning.mark_done, which advances the 90-day plan state in .research/learning/progress.json.
pruned:
  - path: common/ai_cli.py
    reason: >-
      command_for and ask build an argv list and run it with no shell. The prompt is a separate list element placed
      right after -p, and the variadic --allowedTools comes after the prompt, so a prompt cannot become a flag.
      Prompts always start with fixed text ("Today is", "Write"). No shell injection. The stdout ANSI strip and the
      returncode/empty-output checks are correct.
  - path: pipeline/briefing.py
    reason: >-
      Output file names come from the constant Agent.filename values and the date iso string, so there is no path
      traversal. check() only counts mermaid blocks and distinct URLs. That is a weak validation of LLM output
      (invented URLs such as http://a pass) but it is documented as a count check, so I did not file it.
  - path: pipeline/learning.py
    reason: >-
      week_path, split_days and days_of take only ints and constants, so there is no traversal. The bounds for
      week 13 (days 85-90) are consistent between week_of and days_of. split_days(...)[day] in write_today cannot
      KeyError after ensure_week has checked that all the week's days are present.
  - path: common/memory.py
    reason: >-
      progress.json is written atomically (.tmp then replace) under an RLock. The threads in run_day only mutate
      pre-planned stage entries in place, so the dict does not change size while write_index iterates it.
      sync_applied keys on job_id or url and the ledger statuses are plain strings, so the APPLIED_STATUSES
      comparison is sound.
  - path: pipeline/run.py
    reason: >-
      _run converts a SystemExit whose code is not an int (including SystemExit(None), which means success) to
      EXIT_FAILED. That is a minor mismatch with Python semantics. I judged it LOW and did not file it. The
      threading structure (learn first, then the pool and the browser stages) matches the docstring and
      test_agents_run_in_parallel_with_the_browser_stages.
  - path: tests/pipeline/test_pipeline.py
    reason: >-
      Test file only. It does not cover board_names failure, --dry-run with --fresh, empty or corrupt state files,
      or an empty resume path. Those gaps are why the hypotheses below are not caught.
hypotheses:
  - key: pipeline-01
    title: "A swallowed settings error makes board_names return [], which shrinks the day's plan and can mark the day DONE with board stages never run"
    critical_class: error
    severity: HIGH
    anchors:
      - path: pipeline/run.py
        line: 80
        snippet: |-
          except Exception as exc:
              logger.error("Could not load settings: %s", exc)
              return []
      - path: pipeline/run.py
        line: 268
        snippet: |-
          return run_day(args, stages, mem, [s.name for s in every])
      - path: common/memory.py
        line: 120
        snippet: |-
          self.today["plan"] = names
      - path: common/memory.py
        line: 99
        snippet: |-
          return list(self.today.get("plan") or self.today["stages"])
    reachability: >-
      Anyone running python3 -m pipeline whose .env fails to load (wrong cwd, a malformed PLATFORMS value, a missing
      file under launchd). The same-day second run is the trigger: the first run recorded profile:<board> and
      apply:<board> stages, and the second run's settings load fails.
    defect: >-
      board_names catches every Exception and returns an empty list. main() then builds stages without any
      profile:<board> or apply:<board> entries and passes [s.name for s in every] as the full plan. Memory.plan()
      overwrites today["plan"] with that shorter list. Stale board stage entries stay in today["stages"] but are no
      longer in planned(). day_status() looks only at planned(). Once learn, profile:naukri, apply:naukri and the
      briefing stages are done, the day is stamped DAY_DONE with completed_at, and later runs print "today is
      already done" and skip the boards. A transient config error therefore permanently hides unfinished or failed
      board applications for that day.
    contract: >-
      pipeline/run.py docstring: "When every stage is done the day is marked done". common/memory.py docstring:
      "every pipeline stage with its status".
    repro: |-
      1. In tmp_path, build mem = Memory(tmp_path, DAY) and call mem.plan(["learn","apply:naukri","apply:hirist"]).
      2. mem.mark("learn", DONE); mem.mark("apply:naukri", DONE); mem.mark("apply:hirist", FAILED, "exit 3"). Assert mem.day_status() == "in progress".
      3. monkeypatch.setattr("common.config.load_settings", lambda env=None: (_ for _ in ()).throw(RuntimeError("bad env"))) and assert run.board_names(None) == [].
      4. Call run.run_day(_args(), [run.Stage("learn", lambda: 0), run.Stage("apply:naukri", lambda: 0)], Memory(tmp_path, DAY), ["learn","apply:naukri"]), which is what main() passes when the boards list is empty.
      5. Assert Memory(tmp_path, DAY).day_status() == "done" and that apply:hirist is still FAILED in today["stages"].
    confidence: high
  - key: pipeline-02
