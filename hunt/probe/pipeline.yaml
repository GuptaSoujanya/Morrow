  - key: pipeline-12
    title: "Memory.save has no cross-process lock, so two concurrent pipeline runs clobber each other's progress.json"
    critical_class: concurrency
    severity: LOW
    anchors:
      - path: common/memory.py
        line: 65
        snippet: |-
          self.data = self._load()
      - path: common/memory.py
        line: 164
        snippet: |-
          tmp = self.path.with_suffix(".tmp")
      - path: common/memory.py
        line: 165
        snippet: |-
          tmp.write_text(json.dumps(self.data, indent=1, sort_keys=True), encoding="utf-8")
      - path: common/memory.py
        line: 66
        snippet: |-
          self._lock = threading.RLock()
    reachability: >-
      A scheduled run overlapping a manual `python3 -m pipeline`, or `status` or `continue` started while a
      long browser stage is running. The two processes share .memory/.
    defect: >-
      The state is loaded once at construction and then rewritten wholesale on every mark. The only lock is an
      in-process threading.RLock. Two processes each hold a stale copy and each write the full document, so the
      later writer erases the other's stage results, which can make finished apply stages run again. Both also
      use the same fixed progress.tmp name, so one can replace() a half-written temporary file of the other.
      No file lock or reload-merge exists.
    contract: >-
      memory.py docstring: "so a second run the same day continues". The case where the first run is still alive
      is not covered by it.
    repro: |-
      1. a = Memory(tmp_path, DAY); b = Memory(tmp_path, DAY), both created before any write.
      2. a.mark("apply:naukri", DONE); b.mark("learn", DONE).
      3. Assert Memory(tmp_path, DAY).is_done("apply:naukri"). It fails, because b's save overwrote a's entry with its stale in-memory copy.
    confidence: high
