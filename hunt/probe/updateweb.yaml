  reachability: A local dashboard user saves a whole profile or answers file while another tab or client saves a pending fact or answer; both routes operate on the same target file in the threaded dashboard server.
  defect: The whole-file route checks a revision under DashboardServer.file_lock, but partial edits use the unrelated state._EDITS lock. A partial edit committed after the revision check and before os.replace is overwritten. Both requests return success, so the saved phone number or screening answer disappears without a conflict response.
  contract: Successful edits to separate fields must be serialized or merged, or a conflicting whole-file replacement must be rejected before it overwrites a successful partial edit.
  repro: Run hunt/sandbox/test_updateweb.py with sockets disabled. Each parameter invokes the real POST handlers directly with mocked request and response transport. A checkpoint pauses the whole-file write after revision validation; a second thread commits a fact or answer; then the whole-file save resumes. The safety assertion requires the successful partial edit to remain in the final temporary file. Both actual-lock cases fail and both controls using one shared lock pass without modifying target source.
  reproduction_status: isolated-dynamic-confirmation
  remediation: Use one common per-file transaction lock across whole-file replacements and partial fact and answer mutations, keeping revision validation and replacement inside that transaction; retain conflict reporting for stale revisions.
  confidence: high
