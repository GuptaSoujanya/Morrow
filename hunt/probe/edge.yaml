entry_points:
  - {kind: launchd, name: com.naukri-bot.profile-update, path: scripts/install_profile_updater.sh, line: 29, note: "LaunchAgent runs scripts/run_profile_update.sh at load and every 900 s. No EnvironmentVariables, so launchd's minimal PATH applies."}
  - {kind: launchd, name: com.naukri-bot.linkedin-post, path: scripts/install_linkedin_poster.sh, line: 29, note: "LaunchAgent runs scripts/run_linkedin_post.sh at load and every 1800 s."}
  - {kind: script, name: install_profile_updater.sh / install_linkedin_poster.sh, path: scripts/install_profile_updater.sh, line: 38, note: "The local user runs these by hand. They write ~/Library/LaunchAgents/*.plist, then bootout and bootstrap."}
  - {kind: script, name: profile_update_status.sh / linkedin_status.sh, path: scripts/profile_update_status.sh, line: 5, note: "The local user runs these by hand. They read the STATE path from the shell environment or a default."}
