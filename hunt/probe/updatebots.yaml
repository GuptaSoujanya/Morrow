hypotheses:
  - key: updatebots-01
    title: A corrupt screenshot escapes the designed-card failure channel and prevents the Pillow fallback
    severity: MEDIUM
    critical_class: error
    anchors:
      - path: linkedin_bot/design.py
        line: 183
        snippet: problem = image_problem(out_path)
      - path: linkedin_bot/design.py
        line: 130
        snippet: 'with Image.open(path) as image:'
      - path: linkedin_bot/design.py
        line: 125
        snippet: return out_path.is_file()
      - path: linkedin_bot/cli.py
        line: 208
        snippet: 'if card is None:'
    reachability: prepare uses the AI designer by default. If the renderer leaves an invalid or truncated screenshot file, render_html reports success based only on file existence, and design_card attempts to decode it.
    defect: image_problem lets PIL.UnidentifiedImageError and other decode errors escape. design_card catches only AIError around generation, so it never returns None and the caller cannot invoke its Pillow fallback. The isolated test injects inert invalid PNG bytes at the renderer boundary and observes the uncaught PIL exception.
    contract: The design.py module promises that any failure returns None so the caller can draw the Pillow card instead.
    repro: test_updatebots_01_invalid_rendered_png_falls_back mocks the AI answer with inert HTML and mocks the browser renderer to write invalid fixture bytes. The expected None return instead raises PIL.UnidentifiedImageError. test_updatebots_clean_missing_chrome_falls_back passes on the ordinary fallback path.
    reproduction_status: dynamically-confirmed-at-mocked-renderer-boundary
    remediation: Convert renderer-output decoding failures to a rejected design or None, preserving the caller's documented Pillow fallback; validate process completion and decoded output before accepting a screenshot.
    confidence: high
  - key: updatebots-02
    title: The first valid draft bypasses its configured critic when it arrives on the final writing attempt
    severity: MEDIUM
    critical_class: logic
    anchors:
      - path: linkedin_bot/writer.py
        line: 405
        snippet: 'if critic is None or reviewed is not None or attempt == MAX_ATTEMPTS:'
      - path: linkedin_bot/writer.py
        line: 406
        snippet: return draft
      - path: linkedin_bot/writer.py
        line: 407
        snippet: fixes = review(critic, article, draft, notes, voice)
      - path: linkedin_bot/writer.py
        line: 386
        snippet: With a critic, the first draft that passes the checks goes to it once; its fixes
    reachability: A configured, available critic is supplied by prepare. When the writer returns two unusable responses before a valid third response, this is the first passing draft and reviewed is still None.
    defect: The attempt == MAX_ATTEMPTS branch returns the valid third draft before review is invoked. The injected critic returns a plain publish verdict but receives zero calls, so the missing review is demonstrated without judging any disputed semantic finding.
    contract: write_post documents that with a critic, the first draft that passes the checks goes to it once.
    repro: test_updatebots_02_first_valid_third_draft_still_gets_reviewed supplies None, None, then a payload independently verified to pass check_draft and check_visuals. It asserts one critic call and fails with zero. test_updatebots_clean_first_valid_draft_is_reviewed passes with one critic call on the first writing attempt.
    reproduction_status: dynamically-confirmed-with-inert-model-stubs
    remediation: Invoke the critic for the first passing draft regardless of writing-attempt index and make an explicit policy decision for revision feedback when no rewrite attempts remain.
    confidence: high
