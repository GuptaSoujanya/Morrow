hypotheses:
  - key: boards-01
    title: Cutshort second_apply matches related jobs' Apply now on the public page, so a wrong job can be applied to
    critical_class: logic
    severity: MEDIUM
    anchors:
      - {path: cutshort_bot/board.py, line: 22, snippet: 'second_apply=r"^apply now$",'}
      - {path: sites_bot/platforms.py, line: 410, snippet: 'second = _wait_for_controls(driver, board.second_apply, AFTER_CLICK_WAIT_S)'}
    reachability: conditional
    defect: After the first click the loop clicks the first visible control matching ^apply now$; if navigation has not completed, that is a related job's button.
    contract: The board comment says only the posting's own button should be used.
    repro: static-only
    confidence: medium
  - key: boards-02
    title: Default external regex is an unanchored substring match on the word external
    critical_class: logic
    severity: LOW
    anchors:
      - {path: sites_bot/board.py, line: 25, snippet: 'external: str = r"company (?:site|website)|apply on company|external"'}
    reachability: conditional
    defect: Any visible control containing "external" is treated as an Apply button.
    contract: The field is meant to catch only apply-on-company-site buttons.
    repro: static-only
    confidence: medium
  - key: boards-03
    title: Wellfound page_title splits at the first " at ", corrupting title and company
    critical_class: logic
    severity: LOW
    anchors:
      - {path: wellfound_bot/board.py, line: 18, snippet: 'page_title=r"^(?P<title>.+?) (?:at|@) (?P<company>[^•|]+?)(?: [•|].*)?$",'}
    reachability: reachable
    defect: The lazy title group yields title "Engineer" and company "Scale at Stripe" for "Engineer at Scale at Stripe".
    contract: The page title should not make the names worse.
    repro: static-only
    confidence: medium
  - key: boards-04
    title: Cutshort job_link rejects a trailing slash that job_id accepts
    critical_class: logic
    severity: LOW
    anchors:
      - {path: cutshort_bot/board.py, line: 14, snippet: 'job_link=r"^https://cutshort\.io/job/[A-Za-z0-9-]+-[A-Za-z0-9]{8}$",'}
    reachability: conditional
    defect: Card hrefs with a trailing slash or query are silently dropped.
    contract: job_id accepts an optional trailing slash, implying such URLs are expected.
    repro: static-only
    confidence: low
  - key: boards-05
    title: Hirist job_link is unanchored while job_id needs digits at the end
    critical_class: logic
    severity: LOW
    anchors:
      - {path: hirist_bot/board.py, line: 12, snippet: 'job_link=r"^https://www\.hirist\.tech/j/[a-z0-9-]+-\d+",'}
    reachability: conditional
    defect: Links like /j/foo-123/apply pass job_link but the id falls back to the full URL, so one job gets several ids.
    contract: job_id should identify a job from any URL that job_link accepts.
    repro: static-only
    confidence: low
  - key: boards-06
    title: linkify rewrites URLs inside inline code spans
    critical_class: logic
    severity: LOW
    anchors:
      - {path: pipeline/links.py, line: 19, snippet: 'def _outside_code(text: str, fix) -> str:'}
    reachability: reachable
    defect: Only fenced blocks are protected, so a URL later in a code span becomes a markdown link.
    contract: Link-like strings in code are code, not links.
    repro: static-only
    confidence: high
  - key: boards-07
    title: linkify truncates URLs containing parentheses
    critical_class: logic
    severity: LOW
    anchors:
      - {path: pipeline/links.py, line: 28, snippet: 'return _BARE.sub(lambda m: "[%s](%s)" % (m.group(1), m.group(1)), part)'}
    reachability: reachable
    defect: The character class excludes ")" so Wikipedia-style URLs are cut and a stray ")" is left.
    contract: linkify should not damage URLs.
    repro: static-only
    confidence: medium
  - key: boards-08
    title: link_problems reports false broken links for query strings, percent-encoding and root-absolute targets
    critical_class: logic
    severity: LOW
    anchors:
      - {path: pipeline/links.py, line: 58, snippet: 'if not (path.parent / target.split("#")[0]).exists():'}
    reachability: reachable
    defect: Targets are only split on "#" and the scheme test is case-sensitive.
    contract: It finds relative links that point at nothing.
    repro: static-only
    confidence: high
  - key: boards-09
    title: MD_LINK ignores links with a title, so broken ones are never reported
    critical_class: logic
    severity: LOW
    anchors:
      - {path: pipeline/links.py, line: 9, snippet: 'MD_LINK = re.compile(r"\]\(([^)\s]+)\)")'}
    reachability: conditional
    defect: '[a](missing.md "title") does not match, so link_problems and relink skip it.'
    contract: link_problems promises relative links that point at nothing are found.
    repro: static-only
    confidence: high
  - key: boards-10
    title: _CONTACT flags version specs such as pkg@1.2 as contact details
    critical_class: logic
    severity: LOW
    anchors:
      - {path: pipeline/content.py, line: 23, snippet: '_CONTACT = re.compile(r"[\w.+-]+@[\w-]+\.[\w.]+|\+91[\d -]{8,}")'}
    reachability: reachable
    defect: react@18.2 in prose is reported as contact details.
    contract: The check is meant to catch the candidate's email or phone.
    repro: static-only
    confidence: medium
  - key: boards-11
    title: all_problems reports every future week file as missing from day one
    critical_class: logic
    severity: LOW
    anchors:
      - {path: pipeline/content.py, line: 124, snippet: 'for week in range(1, learning.week_of(learning.LAST_DAY) + 1):'}
    reachability: reachable
    defect: All 13 weeks are checked regardless of the current day, so weeks not yet due are reported missing.
    contract: The message says the file is written when the week comes up.
    repro: static-only
    confidence: medium
  - key: boards-12
    title: week_problems counts Day headings inside code fences
    critical_class: logic
    severity: INFO
    anchors:
      - {path: pipeline/content.py, line: 38, snippet: 'numbers = [int(n) for n in re.findall(r"^## Day (\d+)\b", text, re.M)]'}
    reachability: conditional
    defect: Day headings are counted on raw text, so a fenced "## Day 3" masks a missing day.
    contract: Fenced content is code, not structure.
    repro: static-only
    confidence: low
