lane: updatecore
lane_run:
  update_attempt:
    task: /root/core
    status: completed
    note: >-
      Current source reinspection and fixture-only dynamic reproductions; no target edits or external actions.
entry_points:
  - kind: cli
    name: python3 -m pipeline --dry-run --only learn
    path: pipeline/run.py
    line: 369
    note: >-
      Builds the learning stage and invokes the writing callback even in a dry run.
  - kind: cli
