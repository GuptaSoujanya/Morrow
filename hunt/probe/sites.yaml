  - key: sites-12
    title: "Non-atomic read-modify-write of company_sites.md and .env can lose entries or truncate the secrets file"
    critical_class: concurrency
    severity: LOW
    anchors:
      - {path: sites_bot/external.py, line: 1646, snippet: "path.write_text(body, encoding=\"utf-8\")"}
      - {path: sites_bot/accounts.py, line: 93, snippet: "write_env_value(settings.env_file, PASSWORD_KEY, password)"}
    reachability: "Two bot processes overlapping (a web-started run plus a launchd or CLI run), a SIGKILL from the web UI's force stop, or the first-time password generation racing a second process. Precondition: no saved COMPANY_SITE_PASSWORD."
    defect: "_write_company_sites reads the whole file, filters blocks and rewrites it with write_text, which truncates first. A concurrent record_company_site loses the other writer's entry, and a kill mid-write leaves a truncated worklist. account_password generates a password and calls write_env_value, which also rewrites the whole .env with write_text. A kill mid-write truncates the file that holds every secret. Two concurrent first-time runs generate different passwords and the last writer wins. Accounts the first run created are then locked behind a password no longer saved anywhere."
    contract: "none"
    repro: "static-only"
    confidence: low
