    confidence: high
  - key: sites-08
    title: "Stopping a run orphans the claude/Playwright process group and can leave secrets.env on disk"
    critical_class: lifecycle
    severity: MEDIUM
    anchors:
      - {path: sites_bot/browser_agent.py, line: 394, snippet: "start_new_session=True,"}
      - {path: sites_bot/browser_agent.py, line: 397, snippet: "out, err = process.communicate(timeout=settings.browser_agent_timeout_s)"}
      - {path: sites_bot/browser_agent.py, line: 406, snippet: "if secrets is not None and secrets.exists():"}
    reachability: "The local user presses Stop in the web control site (SIGINT, then SIGKILL on a second press, to the bot's process group) or Ctrl-C/kills the bot while an agent task runs. The same applies to any non-timeout exception, for example UnicodeDecodeError from text=True."
    defect: "claude is started in its own session, so the web server's killpg does not reach it. Only the TimeoutExpired branch calls _stop(process). A KeyboardInterrupt or other exception from communicate skips _stop, so claude and its npx Playwright MCP keep running on the CDP browser and spend budget on the user's page, possibly clicking Submit after the bot has gone. On SIGINT the finally unlinks secrets.env. On SIGKILL (the second Stop press, or a launchd kill) no cleanup runs, and secrets.env with the real password stays in data/reports/<date>/agent/<task>/. It is created with the default umask and chmod'd to 0600 only afterwards, so there is a short window with default permissions."
    contract: "web/server.py stop(): 'letting it close the browser cleanly'; browser_agent docstring and README: a bounded task of at most BROWSER_AGENT_TIMEOUT_S seconds and BROWSER_AGENT_BUDGET_USD."
    repro: "1. Use the fake Popen from tests/sites/test_browser_agent.py with communicate raising KeyboardInterrupt. 2. Monkeypatch agent.os.killpg to record calls. 3. Call agent.run_agent(...) inside pytest.raises(KeyboardInterrupt). 4. Assert the recorded killpg calls contain SIGTERM for the process pid; today it is empty."
    confidence: medium
  - key: sites-09
    title: "An uncaught OSError between save_eml, the Gmail append and _record aborts the whole cold-email run, and a long scraped address makes it a daily poison pill"
    critical_class: error
    severity: MEDIUM
    anchors:
      - {path: sites_bot/cold_email.py, line: 304, snippet: "path = folder / (\"%s (%s).eml\" % (name, lead.email))"}
      - {path: sites_bot/cold_email.py, line: 322, snippet: "except imaplib.IMAP4.error as exc:"}
      - {path: sites_bot/cold_email.py, line: 401, snippet: "_record(settings, lead, subject, eml, not problem, now)"}
    reachability: "A posting or page that prints a hiring-context address with a very long domain (the _EMAIL regex has no length cap), or a network reset or SSL error during the Gmail append. The text comes from a third-party posting."
    defect: "save_eml puts the full address in the filename. A domain of about 250 characters gives a name over 255 bytes, so write_bytes raises OSError (File name too long). draft_all has no try/except, so main crashes, skips later leads and skips report.update_quietly. The lead is never recorded, so every later run reaches it again, in the same order, and crashes again. Separately, gmail_draft catches only imaplib.IMAP4.error. A ConnectionResetError or ssl.SSLError (both OSError) during login/append escapes after the .eml is saved and possibly after the Gmail draft was appended. _record is not reached, so the next run drafts the same address again and creates duplicate Gmail drafts."
    contract: "README: 'Once per address: data/inputs/cold_emails.jsonl records every draft; the same address is not written to again for 30 days.'"
    repro: "1. Make a Lead with email 'hr@' + '.'.join(['a'*60]*4) + '.com'. 2. Call ce.draft_all(settings, profile, _Client({'subject': ..., 'body': BODY}), [lead], 10, False). 3. Assert it returns counts without raising; today it raises OSError ENAMETOOLONG. For the second case, monkeypatch ce.imaplib.IMAP4_SSL with a fake whose append raises ConnectionResetError and assert the lead is still recorded in read_records; today it is not."
    confidence: high
  - key: sites-10
    title: "A manual --url run records nothing in the ledger on success, never clears the matching company_sites.md entry, and does not record 'Submit was clicked' errors"
    critical_class: logic
    severity: MEDIUM
    anchors:
      - {path: sites_bot/external.py, line: 1892, snippet: "if result.status == ApplyStatus.ERROR:"}
      - {path: sites_bot/external.py, line: 1650, snippet: "return bool(job.url) and (\"\\n- Naukri: %s\\n\" % job.url) in block + \"\\n\""}
      - {path: sites_bot/external.py, line: 1593, snippet: "\"Delete an entry once you have applied; the bot drops it itself when it\\n\""}
    reachability: "The documented workflow: work one company_sites.md Site link by hand with --url (also the web UI action). Then later run --retry-pending or the Naukri flow."
    defect: "main() builds job.url = args.url, the site link, whereas entries are keyed by their '- Naukri:' line, so _same_job never matches. After an APPLIED_EXTERNAL result, main falls through to return EXIT_OK without forget_company_site, without ledger.record_attempt and without a report row. The original entry stays and is still retryable. On ERROR with 'Submit was clicked ...', main returns without record_company_site (1892), so nothing marks it as sent. retry_pending or a later run can visit the same job again and may submit a duplicate. browser_agent.main has the same job.url = args.url and forget_company_site mismatch."
