  - {kind: http, name: "web control site 'Apply on company site' action", path: web/state.py, line: 108, note: "A localhost request passes url/title/company as an argv list (no shell) to sites_bot.external. The Stop button sends SIGINT to the bot's process group; browser_agent's claude runs in its own session and is not reached (web/server.py:156)."}
  - {kind: cli, name: "python3 -m sites_bot.browser_agent --url [--task]", path: sites_bot/browser_agent.py, line: 647, note: "Local user. Starts claude -p with a Playwright MCP attached over CDP to the bot's Chrome. The prompt carries scraped page and posting text."}
  - {kind: import, name: "browser_agent.take_over / finish_application", path: sites_bot/browser_agent.py, line: 584, note: "Called from external.apply_on_company_site, retry_pending, main and platforms.apply_to when BROWSER_AGENT=true. Input is a Naukri or board posting text and the career-site page."}
  - {kind: cli, name: "python3 -m sites_bot.platforms [--site --update-profile --profile-only]", path: sites_bot/platforms.py, line: 735, note: "Local user. The board job cards, titles, descriptions and Apply links come from third-party recruiters. update_profile runs the agent on the user's board profile."}
  - {kind: cli, name: "python3 -m sites_bot.cold_email [--scan-naukri --to]", path: sites_bot/cold_email.py, line: 421, note: "Local user. Addresses are scraped from tailored postings, agent report.json, company_sites.md and Naukri job pages (third-party text)."}
  - {kind: import, name: "external.apply_on_company_site", path: sites_bot/external.py, line: 1547, note: "Called from naukri_bot/cli.py:879 and :911 during the daily Naukri run. The URL comes from Naukri's 'Apply on company site' button, which the employer controls."}
  - {kind: script, name: "accounts.sign_in / google_login", path: sites_bot/accounts.py, line: 263, note: "Reached from external.apply_here whenever a page has a password box and no file input. Types the shared COMPANY_SITE_PASSWORD on whatever domain the page is on."}
pruned:
  - {path: sites_bot/__init__.py, reason: "One line, no code."}
  - {path: sites_bot/page_brain.py, reason: "No YAML dump or load exists. Page dumps are PNG screenshots in SCREENSHOT_DIR plus text passed in a prompt. Prompt-injection reach is limited to one click among numbered visible controls, with LinkedIn/Indeed labels refused (external.py:~575). The '%' prompt is built with the page text as an argument, not as the format string, so format injection is not possible."}
  - {path: sites_bot/cold_email.py, reason: "Drafts-only invariant holds. There is no smtplib import or send call. The only transport is IMAP APPEND with the \\Draft flag, plus X-Unsent .eml files. Header injection through scraped addresses is not possible: the _EMAIL regex excludes whitespace and control characters, and Subject is whitespace-normalised with split(). The --to value is unvalidated, but only the local user can pass it."}
  - {path: "external_jobs.md / external_archive.md / external_opened.tsv", reason: "These worklist files do not exist in sites_bot. The only worklists are data/inputs/company_sites.md, accounts.md and cold_emails.jsonl. Dedup there is by the exact '- Naukri:' line."}
  - {path: sites_bot/platforms.py (PLATFORM_LIMIT, DRY_RUN), reason: "The limit counts confirmed applications only, with dry runs counted as sent. apply_to returns before the Apply click in dry runs. 2 unconfirmed submits stop the board via sent_unconfirmed in the ledger."}
hypotheses:
  - key: sites-01
    title: "Browser-agent secrets.env sits in the folder the agent can upload from, and all tabs and tools are open to page-injected instructions"
    critical_class: injection
    severity: HIGH
    anchors:
      - {path: sites_bot/browser_agent.py, line: 381, snippet: "secrets.write_text(\"%s=%s\\n\" % (SECRET_NAME, _dotenv_value(settings.company_site_password)), encoding=\"utf-8\")"}
      - {path: sites_bot/browser_agent.py, line: 295, snippet: "\"--allowedTools\", \"mcp__%s\" % SERVER,"}
      - {path: sites_bot/browser_agent.py, line: 159, snippet: "6. Work only in the tab named below, on that site and the sign-in pages it sends"}
    reachability: "A third party controls the career page or posting text. Preconditions: BROWSER_AGENT=true, COMPANY_SITE_PASSWORD set, and the agent following an instruction planted in the page or posting. The posting is placed in the prompt (application_prompt, job.description) and the page arrives through MCP snapshots."
    defect: "README says the password never reaches the model. It is enforced only by prompt rule 6. Only browser_close and browser_run_code_unsafe are disallowed (line 299), so browser_navigate, browser_evaluate, browser_file_upload, browser_tabs and browser_type stay allowed. secrets.env (the real password, written at 381) is created inside workdir. workdir is also claude's cwd, the MCP --output-dir and the folder resume copies go into (line 377). That is the file-upload root. A hostile page can tell the agent to open its file chooser and upload secrets.env, or to navigate to its own login form and type COMPANY_SITE_PASSWORD (the MCP swaps in the real value on any origin). The MCP is also attached to the whole Chrome over CDP, so the Naukri and Google tabs and their sessions are reachable. mcp_config passes no --allowed-origins."
    contract: "README: 'Its only tools are the browser tools ... the password never reaches the model.' Prompt rule 6 is the only guard."
    repro: "static-only"
    confidence: medium
  - key: sites-02
    title: "One shared career-site password is typed, and used to register, on any third-party page that shows a password box, including in dry runs"
    critical_class: secret
    severity: HIGH
    anchors:
      - {path: sites_bot/accounts.py, line: 322, snippet: "state, detail = _submit_sign_in(driver, email, settings.company_site_password, sign_in_fields)"}
      - {path: sites_bot/accounts.py, line: 359, snippet: "state, detail = _submit_create(driver, email, account_password(settings), profile)"}
      - {path: sites_bot/external.py, line: 1469, snippet: "ok, how = sign_in(driver, settings, profile, dry_run)"}
    reachability: "A hostile or look-alike career page. It is reached from a Naukri company-site link, an Instahyre or Hirist 'company website' link, or a web-UI --url. The page needs a password input and no file input, so wants_account() is true. No attacker action is needed beyond hosting the page."
    defect: "apply_here calls sign_in for any host. sign_in has no allowlist, no ATS or host check, and no comparison against accounts.md. If the page has one password box and COMPANY_SITE_PASSWORD is set, _submit_sign_in types the real shared password (322). Dry runs do this too, because only account creation is gated on dry_run. With two password boxes it registers with the same password (359) and ticks the terms boxes. The README states the password is shared across all sites, so one hostile page learns the email plus the password for every account in accounts.md."
    contract: "none"
    repro: "static-only"
    confidence: medium
  - key: sites-03
    title: "GMAIL_APP_PASSWORD is sent over an IMAP TLS connection with no certificate verification and no timeout"
    critical_class: secret
    severity: MEDIUM
    anchors:
      - {path: sites_bot/cold_email.py, line: 312, snippet: "imap = imaplib.IMAP4_SSL(GMAIL_IMAP)"}
      - {path: sites_bot/cold_email.py, line: 314, snippet: "imap.login(account, app_password)"}
    reachability: "A network attacker on the user's path (public wifi or a rogue gateway) while 'python3 -m sites_bot.cold_email' runs with GMAIL_APP_PASSWORD set. No scraped content is involved."
    defect: "IMAP4_SSL is built without ssl_context. In CPython 3.12 that falls back to ssl._create_stdlib_context(), which is an unverified context (CERT_NONE, no hostname check). A MITM can present any certificate and read the account name and app password from login(). The app password gives full IMAP/SMTP access to the Gmail account. There is also no socket timeout, so a stalled server hangs the run."
    contract: "none"
    repro: "1. Monkeypatch ce.imaplib.IMAP4_SSL with a recorder class that accepts *args, **kwargs and a fake login/append/logout. 2. Call ce.gmail_draft(message, 'a@b.test', 'pw'). 3. Assert the recorded kwargs contain a ssl_context whose verify_mode is CERT_REQUIRED and a timeout; the test fails because neither is passed. Alternatively assert ssl._create_stdlib_context().verify_mode == ssl.CERT_NONE."
    confidence: medium
  - key: sites-04
    title: "With no COMPANY_SITE_PASSWORD saved, the agent creates accounts whose real password is the literal word COMPANY_SITE_PASSWORD"
    critical_class: logic
    severity: MEDIUM
    anchors:
      - {path: sites_bot/browser_agent.py, line: 379, snippet: "if settings.company_site_password:"}
      - {path: sites_bot/browser_agent.py, line: 214, snippet: "\"password, which you never see. Creating an account with that email and password is allowed \""}
    reachability: "BROWSER_AGENT=true, an empty COMPANY_SITE_PASSWORD (first use, before the scripted flow generated one), and a site that reaches the agent on a sign-up form. The scripted path generates and saves a password through accounts.account_password; the agent path never does."
    defect: "run_agent writes the secrets file and passes --secrets only when settings.company_site_password is truthy (379). finish_application never calls account_password(). The prompt still tells the agent to type exactly the word COMPANY_SITE_PASSWORD and permits creating an account. With no secrets file the MCP substitutes nothing, so the site gets the literal string 'COMPANY_SITE_PASSWORD' as the password. _keep_account then records the account as created. The user's resume and PII sit behind a publicly guessable password, and later scripted sign-ins use a different generated password."
    contract: "README: 'For the career-site password it types the word COMPANY_SITE_PASSWORD; the Playwright server swaps in the real one from .env.'"
    repro: "1. Build settings with company_site_password=''. 2. Use the fake claude/Popen fixture from tests/sites/test_browser_agent.py and call agent.take_over(driver, job, profile, settings, None, False, stuck). 3. Assert that either a password was generated or the prompt in task.md forbids account creation; today the call has no secrets.env, no --secrets arg in mcp.json, and a prompt that allows account creation."
    confidence: medium
  - key: sites-05
    title: "wait_for_confirmation counts an application as submitted from a URL substring such as 'success' or 'applied' as soon as a page momentarily has no fields"
    critical_class: logic
    severity: MEDIUM
    anchors:
      - {path: sites_bot/external.py, line: 1404, snippet: "if any(word in url for word in _CONFIRM_URL_WORDS) and not discover_fields(driver):"}
      - {path: sites_bot/external.py, line: 161, snippet: "_CONFIRM_URL_WORDS = (\"confirmation\", \"thank\", \"success\", \"submitted\", \"applied\")"}
    reachability: "Any company job URL whose path contains one of those words, for example /customer-success-engineer or /applied-scientist. It triggers when the page has no visible fields right after the Submit click (SPA redraw or navigation). No attacker is needed; a job poster controls the URL."
    defect: "After _click(submit) at 1516, the first loop iteration checks the lower-cased URL for 'success', 'applied', 'thank' and similar words. It does not compare against the pre-submit URL, and it does not look for confirmation text. discover_fields returns [] on any transitional page, so the function returns True and apply_here sets APPLIED_EXTERNAL. The ledger and report then count an application that was never accepted, and the entry is dropped from company_sites.md. The body check also matches generic phrases such as 'thanks for your interest' and 'you have applied' anywhere on the page."
    contract: "README: 'counts the application only when the site confirms it (\"Thank you for applying\", a confirmation page). A site that answers with an error is recorded as an error, never as applied.' Test test_silence_after_submit_is_not_a_confirmation."
    repro: "1. Build the stub driver/page from tests/sites/test_external.py with current_url 'https://jobs.acme.test/careers/customer-success-engineer/apply'. 2. Make find_elements/execute_script return no fields and no errors. 3. Call ext.wait_for_confirmation(driver, timeout_s=0). 4. Assert not confirmed; today it returns (True, 'confirmation page ...')."
    confidence: high
  - key: sites-06
    title: "An exception raised by the Submit click itself is recorded as a plain ERROR without the 'Submit was clicked' marker, so the job can be submitted twice"
    critical_class: error
    severity: MEDIUM
    anchors:
      - {path: sites_bot/external.py, line: 549, snippet: "element.click()"}
      - {path: sites_bot/external.py, line: 552, snippet: "driver.execute_script(_CLICK_SCRIPT, element)"}
      - {path: sites_bot/external.py, line: 1516, snippet: "_click(driver, submit)"}
      - {path: sites_bot/external.py, line: 1573, snippet: "except (StaleElementReferenceException, WebDriverException) as exc:"}
    reachability: "Submit triggers a full navigation. element.click() raises TimeoutException or WebDriverException after the form was already sent, the JS-fallback click then hits a stale element, and the exception escapes apply_here. This is a normal timing failure on slow ATS pages."
    defect: "_click falls back to a second JS click when the first raises. The second call can raise Stale/WebDriverException out of apply_here. apply_on_company_site turns that into ERROR with detail 'TimeoutException: ...' (1573). That text has no 'submit was clicked', so ledger.sent_unconfirmed (LIKE '%submit was clicked%') and external._WAITS_ON_YOU do not hold it back. The job is recorded as a plain error and retried by retry_pending or the next run. platforms.apply_to has the same shape: answer_form clicks Submit inside the try at its except WebDriverException."
    contract: "README: 'a job is recorded as \"Submit was clicked ...\" and never tried again automatically, so nothing is sent twice.' ledger.sent_unconfirmed docstring: 'The application may have gone through, so another attempt could send it twice.'"
    repro: "1. Stub a driver and page for apply_here with a Submit button whose .click() raises TimeoutException and whose execute_script for the click raises StaleElementReferenceException. 2. Call ext.apply_on_company_site(...). 3. Assert result.status == ERROR and 'submit was clicked' in result.detail.lower(), and that ext.retryable({'site': url, 'why': result.detail}) is False. Both assertions fail today."
    confidence: medium
  - key: sites-07
    title: "find_addresses accepts any person's mailbox containing 'hr', 'cv' or 'job' and any address near the word 'mail', not only addresses published for applications"
    critical_class: logic
    severity: MEDIUM
    anchors:
      - {path: sites_bot/cold_email.py, line: 52, snippet: "_HIRING_MAILBOX = re.compile(r\"hr|career|job|recruit|talent|hiring|people|resume|cv|apply\", re.I)"}
      - {path: sites_bot/cold_email.py, line: 51, snippet: "_HIRING_WORDS = re.compile(r\"resume|\\bcv\\b|apply|application|send|share|mail|reach|contact|\\bhr\\b|hiring|recruit|career|interested\", re.I)"}
    reachability: "Any third-party posting, career page or Naukri job page text the bot reads, such as 'Meet our CEO chris@acme.com' or 'Email: shreya@acme.com'. No attacker is needed; an attacker can plant a victim's address in a posting to have a draft with the resume attached created for that address."
    defect: "_HIRING_MAILBOX is an unanchored substring test on the local part. 'chris', 'shreya', 'mehra' and 'jobin' all match, and so does any address whose name contains 'cv' or 'people'. _HIRING_WORDS contains the bare token 'mail', which matches 'email' or 'e-mail' within 140 characters of nearly any printed address. Personal addresses of staff or third parties therefore pass the filter, and a draft with the user's resume and contact details attached is saved to .eml, Gmail Drafts and cold_emails.jsonl."
