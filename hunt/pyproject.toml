[project]
name = "hound"
version = "0.1.0"
description = "HOUND adversarial audit harness for this target; writes only under hunt/ and QUARRY.md."
requires-python = ">=3.12"
dependencies = [
    "typer==0.27.3",
    "pyyaml==6.0.3",
    "bandit==1.9.4",
    "ruff==0.17.1",
    "shellcheck-py==0.11.0.1",
    "semgrep==1.172.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "types-pyyaml>=6.0.12",
]

[dependency-groups]
sandbox = [
    "selenium==4.51.0",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pillow==13.0.0",
    "defusedxml==0.7.1",
    "certifi==2026.10.19",
    "python-dotenv==1.2.4",
    "markdown-it-py==4.2.0",
    "webdriver-manager==4.1.2",
]

[tool.uv]
default-groups = ["sandbox"]

[project.scripts]
hound = "hound:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "identity",
    "schema",
    "registry",
    "runner",
    "parse",
    "check",
    "scope",
    "provenance",
    "liveness",
    "probe",
    "emit",
    "verify",
    "hound",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["fixture", "results", "sandbox", "probe"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLE", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["*.py", "test"]
exclude = ["fixture", "results", "sandbox", "probe"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q -p no:cacheprovider"
