<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Job hunt</title>
  <link rel="icon" type="image/svg+xml" href="/course/logo.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/overview">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">Job hunt</span>
          <span class="brand-sub">apply + study</span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <p class="sidebar-foot">
        <span><kbd>1</kbd>–<kbd>0</kbd></span><span>sections</span>
        <span><kbd>o</kbd></span><span>bigger or smaller output</span>
        <span><kbd>x</kbd></span><span>stops a run</span>
      </p>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="chips" id="chips" aria-live="polite"></div>
      </header>
      <div class="offline" id="offline" hidden>
        Can’t reach the site’s server. Is <code>scripts/web</code> still running?
      </div>
      <main class="content" id="content" tabindex="-1"></main>
      <section class="console" id="console" data-size="collapsed" aria-label="Output"></section>
    </div>
  </div>

  <dialog class="modal editor" id="editor"></dialog>
  <dialog class="modal confirm" id="confirm"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
